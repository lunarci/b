name: Build OptiScaler HUDResource RC1

on:
  push:
    branches: [codex/optiscaler-hudresource-rc1]
    paths: [optiscaler-fix/**, .github/workflows/build-optiscaler-hudresource.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optiscaler-hudresource-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce old selection errors and verify patch behavior
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer optiscaler-fix/tests/hudless_selector_test.cpp -o /tmp/hudresource-test
          /tmp/hudresource-test

  windows-build:
    needs: regression
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the patch builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder
          persist-credentials: false
      - name: Check out the audited OptiScaler revision and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: optiscaler/OptiScaler
          ref: 7daf5d042d32412da407838cd59e0869ecaaa55e
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Verify input and apply the reviewed source patch
        run: |
          python builder/optiscaler-fix/prepare.py upstream
          if ($LASTEXITCODE -ne 0) { throw 'Source verification or patch application failed.' }
      - name: Compile Windows x64 Release with the installed VS2022 toolchain
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'VS2022 MSBuild was not found.' }
          & $msbuild upstream/OptiScaler.sln /m:2 /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /bl:optiscaler-build.binlog
          if ($LASTEXITCODE -ne 0) { throw 'OptiScaler Windows build failed.' }
      - name: Verify the PE image and package the MO2 overlay
        run: |
          python builder/optiscaler-fix/package.py upstream artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Binary verification or packaging failed.' }
      - name: Upload verified build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: OptiScaler-HUDResource-RC1
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: OptiScaler-HUDResource-RC1-build-failure
          path: optiscaler-build.binlog
          if-no-files-found: ignore
          retention-days: 7
