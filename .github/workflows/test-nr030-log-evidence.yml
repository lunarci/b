name: Verify NR030 configured log evidence
on:
  push:
    branches: [nr030-configured-log-evidence]
    paths:
      - nr030-matheus/package/**
      - nr030-matheus/opti-log-diagnostic/**
      - nr030-matheus/tools/Build-OptiLog-Package.py
      - .github/workflows/test-nr030-log-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download pinned SimpleIni parser dependency
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $header=Join-Path $env:RUNNER_TEMP 'SimpleIni.h'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/brofield/simpleini/6048871ea9ee0ec24be5bd099d161a10567d7dc2/SimpleIni.h' -OutFile $header
          if ((Get-FileHash -LiteralPath $header -Algorithm SHA256).Hash.ToLowerInvariant() -cne '969e5b019ba5dfd9f40e9a618f18669c761da20a25026ef0531e4edb769bd86e') { throw 'Pinned SimpleIni hash mismatch.' }
      - name: Verify full configured log collection in Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File nr030-matheus/package/Test-Motion-Tuning.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Motion collector tests failed.' }
      - name: Verify logging backup and restore with actual SimpleIni parser
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File nr030-matheus/package/Test-Opti-Log-Control.ps1 -SimpleIniHeader "%RUNNER_TEMP%\SimpleIni.h"
          exit /b %ERRORLEVEL%
      - name: Require parser and Windows evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $report=Get-Content nr030-matheus/package/test-results/opti-log-control-tests.json -Raw | ConvertFrom-Json
          if (-not $report.WindowsPowerShell51 -or -not $report.ParserCompatible -or $report.Failed -ne 0 -or $report.Passed -ne 8) { throw 'Windows parser and logging control verification was not completed.' }
      - name: Upload diagnostic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NR030-configured-log-tests
          path: nr030-matheus/package/test-results/
          if-no-files-found: error
          retention-days: 14
