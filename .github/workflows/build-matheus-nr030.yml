name: Build Matheus NR030 integration experiment

on:
  push:
    branches:
      - nr030-matheus-presr
      - nr030-combined-color
      - nr030-map-recovery
      - nr030-install-record-fix
      - nr030-complete-install
      - nr030-image-stability
      - nr030-luma-stability
      - nr030-fg-artifact-investigation
      - nr030-motion-artifact-rootfix
    paths:
      - nr030-matheus/**
      - .github/workflows/build-matheus-nr030.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matheus-nr030-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out integration sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Windows x64 Release
        run: cmake -S nr030-matheus -B build/nr030 -A x64 -DNR030_ENABLE_EXPERIMENTAL_RUNTIME=ON "-DNR030_SOURCE_COMMIT=$env:GITHUB_SHA"
      - name: Build component tests and available adapter
        run: cmake --build build/nr030 --config Release --parallel 4
      - name: Run native component and WARP tests
        run: ctest --test-dir build/nr030 -C Release --output-on-failure --output-junit ctest-results.xml
      - name: Validate file ownership and rollback in Windows PowerShell 5.1
        run: |
          if (Test-Path nr030-matheus/package/Test-Package.ps1) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File nr030-matheus/package/Test-Package.ps1
            if ($LASTEXITCODE -ne 0) { throw "Package fixture tests failed: $LASTEXITCODE" }
          }
      - name: Validate complete downloads, configuration, and recovery in Windows PowerShell 5.1
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File nr030-matheus/package/Test-Complete-Package.ps1
          if ($LASTEXITCODE -ne 0) { throw "Complete package fixture tests failed: $LASTEXITCODE" }
      - name: Validate diagnostic apply and exact restore in Windows PowerShell 5.1
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File nr030-matheus/package/Test-Original-Color-Control.ps1
          if ($LASTEXITCODE -ne 0) { throw "Original-color diagnostic tests failed: $LASTEXITCODE" }
      - name: Validate current-session evidence and stale-log classification
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File nr030-matheus/package/Test-Session-Evidence.ps1
          if ($LASTEXITCODE -ne 0) { throw "Session evidence tests failed: $LASTEXITCODE" }
      - name: Assemble experimental installation package
        # This complete package is an intermediate build input only. The
        # artifact below exposes just the reversible ASI comparison package.
        run: |
          ./nr030-matheus/tools/Build-Package.ps1 -BuildRoot "$env:GITHUB_WORKSPACE/build/nr030" -SourceCommit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -ExperimentalReviewed
      - name: Assemble reversible predication repair
        run: |
          python nr030-matheus/tools/Build-PredicationFix-Package.py --base-zip build/nr030/deliverable/Matheus_NR030_0.2.4_LumaStability.zip --source-root nr030-matheus --output build/nr030/deliverable/Matheus_NR030_PredicationFix.zip --source-commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --handoff-results build/nr030/addon/handoff_results.json --control-results nr030-matheus/package/test-results/original-color-control-tests.json --predication-results build/nr030/addon/predication_results.json --session-results nr030-matheus/package/test-results/session-evidence-tests.json
          if ($LASTEXITCODE -ne 0) { throw "Predication repair packaging failed: $LASTEXITCODE" }
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Matheus-NR030-development-evidence-${{ github.run_number }}
          path: |
            build/nr030/Testing/Temporary/
            build/nr030/ctest-results.xml
            build/nr030/**/*.log
            build/nr030/gpu_tests/warp_results.json
            build/nr030/addon/lifetime_results.json
            build/nr030/addon/input_results.json
            build/nr030/addon/handoff_results.json
            build/nr030/addon/predication_results.json
            nr030-matheus/package/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reversible predication repair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Matheus-NR030-predication-fix-${{ github.run_number }}
          path: |
            build/nr030/deliverable/Matheus_NR030_PredicationFix.zip
          if-no-files-found: error
          retention-days: 14
