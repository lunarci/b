; Experimental fixed-C7 adapter. Close the game before changing this file.
; 85: recommended first trial; 75: lower neural resolution; 100: original NR path.
; This file never changes OptiScaler, XeFG, or dlssnr_on_amd.ini.
[MatheusNR030]
Enabled=1
ScalePercent=85
; 100: keep original RGB ratios; 0: previous Matheus colour transfer.
ColourPreservationPercent=100
; 1: reduce correction at depth edges; 0: previous unprotected residual.
DepthProtection=1
; 0..100: blend the final correction. 0 still incurs NR processing cost.
EffectPercent=100
; Retire all proven-complete references; trim extra scratch idle for 2 seconds.
TrimIdleScratch=1
; Once-per-second pool and process DXGI memory budget observations (not FPS).
Diagnostics=1
